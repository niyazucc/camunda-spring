spring:
  datasource:
    # "mem:testdb" means In-Memory (temporary)
    # "./camunda-db" means it creates a file in your project folder (permanent)
    url: jdbc:h2:./camunda-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  h2:
    console:
      enabled: true

camunda:
  bpm:
    # This tells Camunda to also deploy .form files
    deployment-resource-pattern: >
      classpath*:**/*.bpmn,
      classpath*:**/*.bpmn20.xml,
      classpath*:**/*.dmn,
      classpath*:**/*.form

camunda.bpm:
  generic-properties:
    properties:
      historyTimeToLive: P180D
